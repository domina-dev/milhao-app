    <div class="row">
        <div class="col">
            <div class="row">
                <div class="col">
                    <img style="width: 18rem;" src="assets/avatares/avatar-inicio.webp" alt="">
                </div>
                <div class="col">
                    <div class="row" style="margin-top: 2rem;">
                        <button class="inicia-jogo" mat-raised-button>
                            <mat-icon class="icon-roxo">sports_esports</mat-icon>
                            Iniciar Jogo
                        </button>
                    </div>
                    <div class="row" style="margin-top: 2rem;">
                        <button class="ver-ajuda" mat-raised-button>
                            <mat-icon class="icon-amarelo">tips_and_updates</mat-icon>
                            Ver Ajudas
                        </button>
                    </div>
                    <div class="row" style="margin-top: 2rem;">
                        <button class="ultimo-jogo" mat-raised-button>
                            <mat-icon class="icon-azul">history</mat-icon>
                            Último Jogo
                        </button>
                    </div>
                </div>
            </div>
            <div class="row">
                <div>
                    Premiações
                </div>
            </div>
        </div>
        <div class="col-md-4" style="background-color: blanchedalmond; border-radius: 12px;">
            <div style="text-align: center; margin-top: 1rem;">
                <p style="font-size: x-large;">Ranking</p>
            </div>
            <mat-selection-list #shoes [multiple]="false">
                <!-- 
                    O *ngFor agora itera sobre uma lista de jogadores, 
                    onde cada jogador é um objeto com 'nome' e 'pontuacao'.
                -->
                <mat-list-option *ngFor="let jogador of ranking" [value]="jogador.nome">

                    <!-- Container Flexbox para alinhar os itens -->
                    <div class="list-item-container">

                        <!-- Parte da Esquerda: Nome do Jogador -->
                        <span class="item-nome">{{ jogador.nome }}</span>

                        <!-- Parte da Direita: Pontuação e Medalha -->
                        <span class="item-pontuacao">
                            R$ {{ jogador.pontuacao | number:'1.3-3' }} 🥇
                        </span>

                    </div>

                </mat-list-option>
            </mat-selection-list>


            <p>
                Option selected: {{shoes.selectedOptions.selected[0]?.value}}
            </p>
        </div>
    </div>
    <div>
    </div>
</div>
